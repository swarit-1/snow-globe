[package]
name = "m1-spike-inject"
description = "M1 1a spike: CGEventPost hotkey injection at the HID tap, with an optional listen-only tap for OS event timestamps (PLAN.md M1 1a; PRD §10.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "m1-inject"
path = "src/main.rs"

[dependencies]
m1-spike-common.workspace = true
serde_json.workspace = true
libc.workspace = true
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFMachPort", "CFString", "CFDate"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }

[lints]
workspace = true
