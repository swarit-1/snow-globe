# Lookout CI: PRD §12 asks for CI on every push. Under PRD §11.3, GitHub Actions runs CI only and
# never schedules the workers.
#
# NOT RUN YET. This workflow first runs after the owner allows a push to GitHub. Pushing is an
# owner-only action (CLAUDE.md). Until then it is checked locally with actionlint, and `make test`
# runs the same suites on the laptop.
#
# Every job runs the `make test-<suite>` target that `make test` runs locally, so CI runs the same
# commands as the laptop, for every suite in the Makefile's TEST_SUITES except the LAPTOP_ONLY_SUITES
# (docs/checks' `ci-suites` check fails if the two drift apart). The one laptop-only suite is
# speech (app/speech-macos, `swift test`): it needs macOS 26 with Xcode 26.2, and there is no macOS
# job here. A macOS runner bills at a higher rate than Linux on a private repository, and no runner
# image with that toolchain has been checked, so adding one is the owner's call; until then
# `make test` on the laptop is the only place it runs. There are no secrets and no AWS
# credentials, and nothing here calls NPS, NOAA, AWS or a paid service:
#   - each Python suite runs ruff check, ruff format --check and pytest; tests marked `network`
#     are deselected, and pytest runs behind a dead proxy;
#   - Rust runs cargo fmt --check, Terraform fmt -check; the renderer has no formatter configured;
#   - docs/checks runs with the runner's python3 (standard library only), then workers/common's
#     locked ruff checks its code; infra's cost-script ruff step uses that same locked ruff;
#   - Terraform runs init -backend=false, validate and a mocked `terraform test`, never plan or
#     apply. On the laptop the init installs the AWS provider from the plugin cache with no network
#     (infra/tf_providers.sh). The committed lock files hold the darwin_arm64 h1: hash only, so on
#     linux_amd64 the cache never matches, and the infra job always takes the registry fallback;
#   - the renderer runs headless Chromium (SwiftShader), with every page request served locally.
# Otherwise the jobs use the network only for dependencies: PyPI (and uv's Python download),
# crates.io, the npm registry, GitHub (the actions and the oculus-core pin), Playwright's Chromium
# download and the Terraform registry.
# Each action is pinned to a full commit SHA; the comment names its release tag. The tags were
# resolved with `git ls-remote` on 19 Nov 2026.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.suite }} (uv sync --locked, ruff check + format --check, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # common also validates viewpoints/manifests against the JSON schema (make viewpoints-check)
          - suite: common
            lock: workers/common/uv.lock
          - suite: capture
            lock: workers/capture/uv.lock
          - suite: forecast
            lock: workers/forecast/uv.lock
          # bench/ (stdlib unittest, check.py --no-parser, ruff) runs on workers/common's Python
          # and ruff; its parser tests skip without a fresh release build of lookout-parse.
          - suite: bench
            lock: workers/common/uv.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
          cache-dependency-glob: ${{ matrix.lock }}
      - name: make test-${{ matrix.suite }} (Python 3.13 from .python-version)
        run: make test-${{ matrix.suite }}

  eval:
    name: eval (oculus-core from source, renderer contract under Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `uv sync --locked` builds oculus-core-py with maturin from the public pin 1b5410b
      # (eval/pyproject.toml), so the job needs Rust.
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
      # The default suite runs renderer/src/scene.ts validateScene() under Node 24 (no npm packages,
      # no browser); without Node 24 that test skips and SceneSpec drift would go unnoticed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
          cache-dependency-glob: eval/uv.lock
      - name: make test-eval
        run: make test-eval

  renderer:
    name: renderer (tsc, vitest, headless Chromium + SwiftShader)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: renderer/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        working-directory: renderer
        run: pnpm install --frozen-lockfile
      - name: Playwright's Chromium headless shell and its system libraries
        working-directory: renderer
        run: pnpm exec playwright-core install --with-deps --only-shell chromium
      # Off darwin/arm64 the goldens are not expected to match pixel for pixel; the golden test then
      # applies PRD §13.1's rule, SSIM >= 0.98 (renderer/README.md, "Matching rules").
      - name: make test-renderer
        run: make test-renderer

  rust:
    name: rust (cargo test, clippy -D warnings, fmt --check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Makefile's default target dir is outside the repo, for the iCloud-synced laptop; here it
      # stays in the workspace so rust-cache can save it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01e2821fc38dbca62c2557c927b33938a2e005fd # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
      # TODO(M1): when app/src-tauri joins the workspace, install the Tauri Linux build deps here
      # (libwebkit2gtk-4.1-dev, librsvg2-dev, libayatana-appindicator3-dev) or exclude that crate.
      - name: make test-rust
        run: make test-rust

  infra:
    name: infra (terraform fmt, validate, mocked test; shellcheck; script stubs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      # infra/test.sh keeps the AWS provider (~760 MB unpacked) in TF_PLUGIN_CACHE_DIR, by default
      # $HOME/lookout-data/cache/terraform-plugins. With TF_INIT=auto (the default) the job uses
      # the registry until the lock files also hold the linux_amd64 h1: hash (infra/README.md,
      # "Network"); then this cache lets it run offline like the laptop.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lookout-data/cache/terraform-plugins
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/terraform/.terraform.lock.hcl', 'infra/terraform/bootstrap/.terraform.lock.hcl') }}
      # make test-infra syncs workers/common and puts its locked ruff first on PATH, so
      # infra/tests/test_cost.sh's ruff step runs with the pinned version here too, not skipped.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
          cache-dependency-glob: workers/common/uv.lock
      # shellcheck is preinstalled on ubuntu-24.04. Docker with buildx is too, so the Lambda
      # build-context check runs: a FROM scratch export, with nothing pulled or pushed.
      - name: Tool versions
        run: |
          terraform version
          shellcheck --version
          docker buildx version
      - name: make test-infra
        run: make test-infra

  docs:
    name: docs (links, dates, append-only DECISIONS.md, notices, Appendix A, CI suites; ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The append-only check reads every version of DECISIONS.md in the history.
          fetch-depth: 0
      # The checks themselves need only the runner's python3; uv brings workers/common's locked
      # ruff for their own code.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
          cache-dependency-glob: workers/common/uv.lock
      - name: make test-docs (docs-check with the standard library, then ruff on docs/checks)
        run: |
          python3 --version
          make test-docs
