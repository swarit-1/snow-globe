# Lint and format settings for bench/ (stdlib-only scripts, no pyproject): the same rules as every
# pyproject.toml in the repo. Run: ruff check bench && ruff format --check bench
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Docstrings and notes use the PRD's own symbols (en dash, minus sign, times).
allowed-confusables = ["–", "−", "×"]
